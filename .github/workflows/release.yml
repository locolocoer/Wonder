name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 构建安装包
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download bundled gcc (w64devkit)
        shell: pwsh
        run: ./scripts/download-w64devkit.ps1

      - name: Build renderer & package installer
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dojo-installers
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true

      # 把产物同步到阿里云 OSS，作为自动更新的主源（加速国内分发）。
      # 需要在仓库 Settings → Secrets 配置 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET，
      # 可在 Settings → Variables 配置 OSS_BUCKET（默认 fryappstore）/ OSS_ENDPOINT（默认北京）。
      # 未配置 Secrets 时自动跳过，客户端回退到 GitHub Releases。
      - name: Upload to Aliyun OSS
        if: env.OSS_ACCESS_KEY_ID != ''
        continue-on-error: true
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'fryappstore' }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT || 'oss-cn-beijing.aliyuncs.com' }}
        run: |
          set -e
          curl -sL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o ossutil
          chmod +x ossutil
          ./ossutil config -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "artifacts/v${VERSION}"
          # latest*.yml 留在 dojo 根目录作为稳定更新指针，其余产物按版本归档
          for f in artifacts/*; do
            [ -d "$f" ] && continue
            case "$(basename "$f")" in
              latest*.yml) ;;
              *) mv "$f" "artifacts/v${VERSION}/" ;;
            esac
          done
          for yml in artifacts/latest*.yml; do
            [ -f "$yml" ] || continue
            sed -i -E "s#(url|path): #\1: v${VERSION}/#" "$yml"
          done
          # --acl public-read：客户端用匿名 GET 下载更新，对象必须可公开读取
          if ! ./ossutil cp -rf artifacts/ "oss://${OSS_BUCKET}/dojo/" --acl public-read; then
            echo "::error::OSS 上传失败：请确认 AccessKey 对桶 ${OSS_BUCKET} 有写权限，且桶允许匿名读取。"
            exit 1
          fi

      # 探活：确认自动更新源可匿名读取（否则客户端会 403，静默回退 GitHub）
      - name: Verify OSS update feed is publicly readable
        if: always() && env.OSS_ACCESS_KEY_ID != ''
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'fryappstore' }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT || 'oss-cn-beijing.aliyuncs.com' }}
        run: |
          URL="https://${OSS_BUCKET}.${OSS_ENDPOINT}/dojo/latest.yml"
          echo "check $URL"
          CODE=$(curl -s -o /tmp/latest.yml -w '%{http_code}' "$URL" || echo 000)
          echo "HTTP $CODE"
          cat /tmp/latest.yml || true
          if [ "$CODE" = "200" ]; then
            echo "OK: OSS 更新源可用"
            exit 0
          fi
          echo "::error::OSS 更新源不可匿名读取（HTTP $CODE）。客户端会回退到 GitHub Releases。"
          exit 1
